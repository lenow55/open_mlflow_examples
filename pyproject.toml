[project]
name = "open-mlflow-examples"
version = "0.1.0"
description = "Проект с примерами работы mlflow логирования"
authors = [{ name = "Ilia Novikov", email = "nov.ilucha@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
  "mlflow[databricks] (>=3.17.2,<4.0.0)",
  "openai (>=1.58.0,<2.0.0)",
  "more-itertools (>=10.5.0,<11.0.0)",
  "langchain (>=0.3.13,<0.4.0)",
  "langchain-openai (>=0.2.14,<0.3.0)",
  "langchain-community (>=0.3.13,<0.4.0)",
  "optuna (>=4.1.0,<5.0.0)",
  "xgboost (>=2.1.3,<3.0.0)",
  "seaborn[stats] (>=0.13.2,<0.14.0)",
  "shap (>=0.46.0,<0.47.0)",
  "pydantic (>=2.10.4,<3.0.0)",
  "catboost (>=1.2.8,<2.0.0)",
  "plotly (>=7.1.0,<8.0.0)",
  "pandas (>=3.1.0,<4.0.0)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
  "pandas-stubs (>=3.0.5.260914,<4.0.0.0)",
  "scipy-stubs (>=1.18.1.1,<2.0.0.0)",
  "jupyterlab (>=4.6.4,<5.0.0)",
  "ipywidgets (>=8.1.9,<9.0.0)",
  "jupyterlab-git (>=0.55.0,<0.56.0)",
]
